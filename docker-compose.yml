services:
  postgres:
    image: postgres:17-alpine
    container_name: isocal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: isocal-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_HTTP_PORT: 3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-12}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required}
      DATABASE_SSL: "false"
      FILE_STORAGE_ROOT: /app/storage
      BOOTSTRAP_SUPER_ADMIN_NAME: ${BOOTSTRAP_SUPER_ADMIN_NAME:-}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      QUOTATION_INTERNAL_EMAIL: ${QUOTATION_INTERNAL_EMAIL:-}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME:-}
      COMPANY_TAX_ID: ${COMPANY_TAX_ID:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_WHATSAPP: ${COMPANY_WHATSAPP:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}
      COMPANY_OPERATIONS_EMAIL: ${COMPANY_OPERATIONS_EMAIL:-}
      COMPANY_OPERATIONS_PHONE: ${COMPANY_OPERATIONS_PHONE:-}
      COMPANY_WEBSITE: ${COMPANY_WEBSITE:-}
      COMPANY_OFFICE_ADDRESS: ${COMPANY_OFFICE_ADDRESS:-}
      COMPANY_LAB_ADDRESS_PRIMARY: ${COMPANY_LAB_ADDRESS_PRIMARY:-}
      COMPANY_LAB_ADDRESS_SECONDARY: ${COMPANY_LAB_ADDRESS_SECONDARY:-}
      COMPANY_INSTAGRAM_URL: ${COMPANY_INSTAGRAM_URL:-}
      COMPANY_FACEBOOK_URL: ${COMPANY_FACEBOOK_URL:-}
      COMPANY_YOUTUBE_URL: ${COMPANY_YOUTUBE_URL:-}
      COMPANY_LINKEDIN_URL: ${COMPANY_LINKEDIN_URL:-}
      COMPANY_TIKTOK_URL: ${COMPANY_TIKTOK_URL:-}
      QUOTATION_VALIDITY_DAYS: ${QUOTATION_VALIDITY_DAYS:-7}
      QUOTATION_PAYMENT_TERMS: ${QUOTATION_PAYMENT_TERMS:-Contado}
      QUOTATION_SERVICE_TIME: ${QUOTATION_SERVICE_TIME:-3 días calendario}
      QUOTATION_DELIVERABLES: ${QUOTATION_DELIVERABLES:-1 Certificado de calibración por equipo}
      QUOTATION_LABORATORY: ${QUOTATION_LABORATORY:-ISOCAL}
      PAYMENT_ACCOUNT_HOLDER: ${PAYMENT_ACCOUNT_HOLDER:-}
      PAYMENT_BCP_ACCOUNT_PEN: ${PAYMENT_BCP_ACCOUNT_PEN:-}
      PAYMENT_BCP_CCI_PEN: ${PAYMENT_BCP_CCI_PEN:-}
      PAYMENT_BCP_DETRACTION_ACCOUNT: ${PAYMENT_BCP_DETRACTION_ACCOUNT:-}
      PAYMENT_YAPE_NUMBER: ${PAYMENT_YAPE_NUMBER:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - backend_storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_PUBLIC_API_URL: ${VITE_PUBLIC_API_URL:-}
    container_name: isocal-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: isocal_postgres_data
  backend_storage:
    name: isocal_backend_storage
