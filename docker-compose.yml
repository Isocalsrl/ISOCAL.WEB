services:
  postgres:
    image: postgres:17
    container_name: isocal-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: isocal

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isocal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
